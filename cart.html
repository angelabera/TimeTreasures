<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=The+Girl+Next+Door&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pro.css">
    <title>Shopping Cart - TimeTreasures</title>
    <style>
        .cart-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            background: rgba(90, 67, 35, 0.9);
            border-radius: 15px;
            margin-top: 2rem;
        }
        .cart-title {
            text-align: center;
            font-size: 2.5rem;
            color: #f2bf1a;
            font-family: 'Cinzel', serif;
            margin-bottom: 2rem;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(60, 45, 20, 0.8);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        .cart-item img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-name {
            color: #e2c275;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .cart-item-price {
            color: #d4af37;
            font-weight: bold;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .qty-btn {
            background: #f2bf1a;
            color: #2c2c2c;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .qty-input {
            width: 50px;
            text-align: center;
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #f2bf1a;
            border-radius: 5px;
            padding: 5px;
        }
        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 1rem;
        }
        .cart-total {
            text-align: center;
            margin: 2rem 0;
            font-size: 1.5rem;
            color: #f2bf1a;
            font-weight: bold;
        }
        .checkout-btn {
            display: block;
            margin: 0 auto;
            background: linear-gradient(135deg, #f2bf1a, #d4af37);
            color: #2c2c2c;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .empty-cart {
            text-align: center;
            color: #c4b79c;
            font-size: 1.2rem;
            margin: 2rem 0;
        }
        .continue-shopping {
            display: block;
            text-align: center;
            color: #f2bf1a;
            text-decoration: none;
            margin-top: 1rem;
        }
        
        /* Footer Styling */
        .footer {
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            color: #f5f5dc;
            padding: 3rem 2rem 2rem;
            text-align: center;
            border-top: 3px solid #f2bf1a;
            margin-top: 4rem;
        }
        
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .footer-main {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #c4b79c;
        }
        
        .footer-credit {
            font-size: 0.9rem;
            color: #f2bf1a;
            font-family: 'The Girl Next Door', cursive;
            font-weight: 400;
            margin-top: 0.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(242, 191, 26, 0.3);
        }
        
        .footer-credit::before {
            content: "✨ ";
            margin-right: 0.3rem;
        }
        
        .footer-credit::after {
            content: " ✨";
            margin-left: 0.3rem;
        }
        
        @media (max-width: 768px) {
            .footer {
                padding: 2rem 1rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1 class="logo">TimeTreasures</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart <span class="cart-count" style="display: none;">0</span></a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="product-page">
        <div class="cart-container">
            <h1 class="cart-title">Shopping Cart</h1>
            <div id="cart-items"></div>
            <div id="cart-total" class="cart-total"></div>
            <button id="checkout-btn" class="checkout-btn" style="display: none;">Proceed to Checkout</button>
            <a href="products.html" class="continue-shopping">← Continue Shopping</a>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-main">© 2025 TimeTreasures. All rights reserved.</p>
            <p class="footer-credit">Made with ❤️ by Angela Bera</p>
        </div>
    </footer>

    <script src="cart.js"></script>
</body>
</html>
